name: Hourly Dashboard Update (Databento)

on:
  schedule:
    - cron: '0 * * * 1-5'  # Every hour, Monday through Friday (UTC)
  workflow_dispatch: {}   # Manual trigger

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env for Databento
        run: |
          echo "DATABENTO_API_KEY=${{ secrets.DATABENTO_API_KEY }}" >> .env
          echo "ACTIVE_PROVIDER=databento" >> .env

      - name: Fetch Databento snapshot (GC / ES / NQ -> trading_results CSVs)
        run: python fetch_databento_snapshot.py GC ES NQ

      - name: Update dashboard JSON from results
        run: python update_dashboard.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ trading_results/
          git commit -m "Data: auto-update $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "No changes to commit"
          git push